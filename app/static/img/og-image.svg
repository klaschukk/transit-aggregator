<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0d9488"/>
  <rect width="1200" height="630" fill="url(#grad)" opacity=".6"/>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <!-- Bus icon -->
  <g transform="translate(600,240)" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-48" y="-60" width="96" height="84" rx="18" opacity=".9"/>
    <line x1="-48" y1="-6" x2="48" y2="-6" opacity=".5"/>
    <circle cx="-24" cy="42" r="9" fill="#fff"/>
    <circle cx="24" cy="42" r="9" fill="#fff"/>
  </g>
  <!-- Title -->
  <text x="600" y="370" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="72" font-weight="800" fill="#fff">Prevozni.com</text>
  <!-- Subtitle -->
  <text x="600" y="420" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="28" fill="rgba(255,255,255,.75)">Red vožnje autobusa i vozova u Srbiji</text>
  <!-- Bottom accent line -->
  <rect x="480" y="470" width="240" height="4" rx="2" fill="#fff" opacity=".3"/>
</svg>

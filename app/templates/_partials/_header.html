<header class="site-header">
  <div class="container site-header__inner">
    <a href="{{ lang_prefix }}/" class="site-logo">
      <svg class="site-logo__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24" aria-hidden="true">
        <circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/>
        <path d="M4 16V8a4 4 0 014-4h8a4 4 0 014 4v8"/>
        <path d="M2 12h20"/>
      </svg>
      <span class="site-logo__text">Prevozni</span>
    </a>
    <nav class="site-nav">
      <a href="{{ lang_prefix }}/rute/" class="site-nav__link">{{ _('nav.all_routes') }}</a>
      <a href="{{ lang_prefix }}/gradski/beograd/" class="site-nav__link">{{ _('nav.city_transport') }}</a>
      <a href="{{ lang_prefix }}/" class="site-nav__link site-nav__search" aria-label="{{ _('nav.search') }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
          <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
        </svg>
      </a>
      <!-- Language switcher -->
      <div class="site-nav__lang">
        {% for l in supported_langs %}
        {% if l != lang %}
        <a href="{{ lang_url(request.path | replace(lang_prefix, '', 1), l) }}" class="site-nav__lang-link">{{ l|upper }}</a>
        {% endif %}
        {% endfor %}
      </div>
    </nav>
    <button class="site-nav-toggle" id="navToggle" aria-label="{{ _('nav.menu') }}" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24">
        <path d="M3 12h18M3 6h18M3 18h18"/>
      </svg>
    </button>
  </div>
</header>

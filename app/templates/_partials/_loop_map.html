{# Planner map: a server-drawn SVG sketch is the instant poster; Mapbox GL is
   layered over it on idle/intent (_loop_map_script.html). Without a token or
   with the library blocked, the sketch stays. Needs: map_data, map_sketch. #}
<div class="loop-map" id="loopMap" role="region" aria-label="{{ map_label }}" data-map="{{ map_data|tojson|forceescape }}">
  <svg class="loop-map__poster" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid meet" aria-hidden="true" focusable="false">
    {% if map_data.mode == 'network' %}
      {% for e in map_data.edges %}
      {% set _a = map_sketch[e[0]] %}{% set _b = map_sketch[e[1]] %}
      <path class="loop-map__edge" d="M{{ _a[0] }} {{ _a[1] }} Q{{ ((_a[0] + _b[0]) / 2 + (_b[1] - _a[1]) * 0.16)|round(1) }} {{ ((_a[1] + _b[1]) / 2 - (_b[0] - _a[0]) * 0.16)|round(1) }} {{ _b[0] }} {{ _b[1] }}"/>
      {% endfor %}
      {% for pt in map_sketch %}
      <circle class="loop-map__dot" cx="{{ pt[0] }}" cy="{{ pt[1] }}" r="6"/>
      {% endfor %}
    {% else %}
      <polyline class="loop-map__line" points="{% for pt in map_sketch %}{{ pt[0] }},{{ pt[1] }} {% endfor %}"/>
      {% for pt in map_sketch[:map_data.stops|length] %}
      <circle class="loop-map__pin" cx="{{ pt[0] }}" cy="{{ pt[1] }}" r="13"/>
      <text class="loop-map__num" x="{{ pt[0] }}" y="{{ pt[1] }}" dy="0.36em" text-anchor="middle">{{ loop.index }}</text>
      {% endfor %}
    {% endif %}
  </svg>
  <div class="loop-map__canvas" id="loopMapCanvas"></div>
  <div class="loop-map__tools">
    <button type="button" class="loop-map__tool" data-map-reset aria-label="{{ _('planner.map_reset') }}" title="{{ _('planner.map_reset') }}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18" aria-hidden="true"><path d="M3 9V5a2 2 0 012-2h4M15 3h4a2 2 0 012 2v4M21 15v4a2 2 0 01-2 2h-4M9 21H5a2 2 0 01-2-2v-4"/><circle cx="12" cy="12" r="2.5"/></svg>
    </button>
    <button type="button" class="loop-map__tool loop-map__tool--expand" data-map-expand aria-pressed="false" aria-label="{{ _('planner.map_expand') }}" title="{{ _('planner.map_expand') }}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18" aria-hidden="true"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
    </button>
  </div>
</div>

stages:
  - test
  - deploy

variables:
  DEPLOY_HOST: "178.105.76.3"
  DEPLOY_USER: "root"
  DEPLOY_DIR: "/root/klaschuk/transit-aggregator"

# ──────────────────────────────────────────────
# TEST — runs on GitLab shared runners
# ──────────────────────────────────────────────
test:
  stage: test
  image: python:3.12-slim
  only:
    - main
    - merge_requests
  variables:
    FLASK_ENV: testing
    SECRET_KEY: ci-test-secret
    DUCKDB_PATH: "tests/seed.duckdb"
  before_script:
    - pip install -r requirements.txt -q
  script:
    - python -m pytest tests/ -x -q --tb=short
        --ignore=tests/test_data_quality.py
        --ignore=tests/test_integration.py
        2>&1 | tail -40
  allow_failure: false

# ──────────────────────────────────────────────
# DEPLOY — SSH into production server
# Requires CI/CD variable DEPLOY_SSH_KEY (base64-encoded private key)
# Add in GitLab: Settings → CI/CD → Variables
# ──────────────────────────────────────────────
deploy:
  stage: deploy
  image: alpine:latest
  only:
    - main
  when: on_success
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$DEPLOY_SSH_KEY" | base64 -d > ~/.ssh/id_deploy
    - chmod 600 ~/.ssh/id_deploy
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - |
      ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no \
        "${DEPLOY_USER}@${DEPLOY_HOST}" \
        "cd ${DEPLOY_DIR} && \
         git fetch origin main && \
         git reset --hard origin/main && \
         venv/bin/pip install -r requirements.txt -q && \
         systemctl restart transit && \
         sleep 3 && \
         curl -sf http://127.0.0.1:8000/health | python3 -c \"import sys,json; d=json.load(sys.stdin); print('Deploy OK, status:', d['transit']['status'])\""
  environment:
    name: production
    url: https://prevozni.com

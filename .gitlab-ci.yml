stages:
  - deploy

deploy:
  stage: deploy
  only:
    - main
  before_script:
    - which ssh-agent || apt-get install -y openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | base64 -d | ssh-add -
    - mkdir -p ~/.ssh
    - ssh-keyscan -p 7742 81.28.248.71 >> ~/.ssh/known_hosts
  script:
    - ssh -p 7742 klaschuk@81.28.248.71 "cd ~/transit && git pull origin main && source venv/bin/activate && pip install -r requirements.txt -q && sudo systemctl restart transit"

stages:
  - test
  - deploy

variables:
  DEPLOY_HOST: "178.105.76.3"
  DEPLOY_USER: "root"
  DEPLOY_DIR: "/opt/prevozni"

# ──────────────────────────────────────────────
# TEST (CI) — runs on every push to main and on merge requests.
# This is the gate: code only reaches `deploy` after the suite is green.
# ──────────────────────────────────────────────
test:
  stage: test
  image: python:3.12-slim
  only:
    - main
    - merge_requests
  variables:
    FLASK_ENV: testing
    SECRET_KEY: ci-test-secret
    DUCKDB_PATH: "tests/seed.duckdb"
  before_script:
    - pip install -r requirements.txt -q
  script:
    # test_data_quality now self-skips on the seed DB (autouse guard), so it is
    # collected and visible instead of hidden. test_integration/test_privacy
    # still need a full DB / live services — left ignored until they get the
    # same graceful-skip treatment.
    - python -m pytest tests/ -x -q --tb=short
        --ignore=tests/test_integration.py
        --ignore=tests/test_privacy.py
        2>&1 | tail -40
  allow_failure: false

# ──────────────────────────────────────────────
# DEPLOY — MANUAL (no continuous deployment).
# Continuous deploy was removed: it reset the production tree to origin/main
# automatically and repeatedly wiped in-progress work. Deploy is now an
# explicit decision — click ▶ on this job in the GitLab pipeline when you
# want to ship. Requires CI/CD variable DEPLOY_SSH_KEY (base64 private key).
# ──────────────────────────────────────────────
deploy:
  stage: deploy
  image: alpine:latest
  only:
    - main
  when: manual          # ← was `on_success` (auto). Now a manual button.
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$DEPLOY_SSH_KEY" | base64 -d > ~/.ssh/id_deploy
    - chmod 600 ~/.ssh/id_deploy
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - |
      ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no \
        "${DEPLOY_USER}@${DEPLOY_HOST}" \
        "cd ${DEPLOY_DIR} && \
         git fetch origin main && \
         git reset --hard origin/main && \
         venv/bin/pip install -r requirements.txt -q && \
         venv/bin/python scripts/minify_css.py && \
         systemctl restart transit && \
         sleep 3 && \
         curl -sf http://127.0.0.1:8000/health | python3 -c \"import sys,json; d=json.load(sys.stdin); print('Deploy OK, status:', d['status'], 'version:', d.get('version'))\""
  environment:
    name: production
    url: https://prevozni.com
